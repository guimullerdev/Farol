name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install libssl1.1 (SQLCipher prebuilt binary requires OpenSSL 1.1)
        run: |
          curl -fsSLO http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
          sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
          rm libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Xvfb (for Electron E2E)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Verify desktop app builds
        run: yarn workspace @farol/desktop exec electron-vite build

      - name: E2E tests
        run: xvfb-run --auto-servernum yarn playwright test
